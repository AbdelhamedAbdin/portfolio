<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kare Node - Business Name Update</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
            color: #1c1e21;
        }

        .card {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .badge {
            display: inline-block;
            padding: 7px 13px;
            margin-bottom: 22px;
            border-radius: 20px;
            background: #e7f3ff;
            color: #1877f2;
            font-size: 14px;
            font-weight: 600;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 16px;
        }

        .description {
            color: #606770;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .change-box {
            padding: 24px;
            border: 1px solid #e4e6eb;
            border-radius: 12px;
            background: #fafafa;
        }

        .label {
            color: #65676b;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 7px;
        }

        .old-name {
            font-size: 20px;
            color: #8a8d91;
            text-decoration: line-through;
            margin-bottom: 20px;
        }

        .new-name {
            font-size: 27px;
            font-weight: 700;
            color: #1c1e21;
        }

        .notice {
            margin-top: 28px;
            padding: 16px;
            border-left: 4px solid #1877f2;
            background: #f0f6ff;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="badge">Business Information Update</div>

    <h1>Business Name Update</h1>

    <p class="description">
        This page publicly confirms the update of our business name.
    </p>

    <div class="change-box">

        <div class="label">Previous Name</div>
        <div class="old-name">Creative handmade</div>

        <div class="label">Updated Name</div>
        <div class="new-name">Kare Node</div>

    </div>

    <div class="notice">
        <strong>Official Notice:</strong><br>
        Creative handmade has changed its business name to
        <strong>Kare Node</strong>.
    </div>

</div>

</body>
</html>
